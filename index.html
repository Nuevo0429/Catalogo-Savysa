<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | Savysa</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <header>
    <h1>Savysa</h1>
    <p>Tu belleza nos importa</p>
    <div class="controles">
      <input type="text" id="buscador" placeholder="Buscar producto...">
      <select id="filtroCategoria">
        <option value="todas">Todas las categorías</option>
      </select>
    </div>
  </header>

  <main class="grid-productos" id="contenedorProductos"></main>

  <!-- Esfera flotante y menú de redes sociales -->
  <div class="redes-flotantes" id="menuRedes">
    <div class="panel-redes" id="panelRedes" role="menu" aria-label="Redes sociales de Savysa">
      <a href="https://www.instagram.com/savysa04?jplx=MW41NmYycWp0NnJ6MA==" target="_blank" rel="noopener noreferrer" class="item-red ig" role="menuitem">
        <span class="badge-red">IG</span>
        <span>Instagram</span>
      </a>
      <a href="https://whatsapp.com/channel/0029Vb8P2dKChq6PMYuRuG2z" target="_blank" rel="noopener noreferrer" class="item-red wa" role="menuitem">
        <span class="badge-red">WA</span>
        <span>Canal WhatsApp</span>
      </a>
      <a href="https://www.tiktok.com/@savysa04" target="_blank" rel="noopener noreferrer" class="item-red tt" role="menuitem">
        <span class="badge-red">TT</span>
        <span>TikTok</span>
      </a>
    </div>

    <button type="button" class="esfera-redes" id="btnEsferaRedes" aria-expanded="false" aria-controls="panelRedes" aria-label="Abrir redes sociales">
      <span class="etiqueta-redes">Síguenos</span>
      <span class="icono-esfera" id="iconoEsfera">+</span>
    </button>
  </div>

  <script>
    const TELEFONO_WHATSAPP = "584249211053";
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw54J0tHFf0R5dFe-DNhCeIuxYSIrYfh-aONSa0TjChpXVqDwS4pdpPGQ38BTqA0-dLtJse6jHnJtz/pub?gid=1164452400&single=true&output=csv";

    const contenedor = document.getElementById('contenedorProductos');
    const buscador = document.getElementById('buscador');
    const filtroCategoria = document.getElementById('filtroCategoria');

    const btnEsferaRedes = document.getElementById('btnEsferaRedes');
    const panelRedes = document.getElementById('panelRedes');
    const iconoEsfera = document.getElementById('iconoEsfera');

    let PRODUCTOS = [];

    function quitarTildes(texto) {
      return (texto || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function parsearCSVCompleto(textoCSV) {
      const filas = [];
      let filaActual = [];
      let celdaActual = "";
      let entreComillas = false;

      for (let i = 0; i < textoCSV.length; i++) {
        const char = textoCSV[i];
        const siguiente = textoCSV[i + 1];

        if (char === '"') {
          if (entreComillas && siguiente === '"') {
            celdaActual += '"';
            i++;
          } else {
            entreComillas = !entreComillas;
          }
        } else if (char === ',' && !entreComillas) {
          filaActual.push(celdaActual.trim());
          celdaActual = "";
        } else if ((char === '\r' || char === '\n') && !entreComillas) {
          if (char === '\r' && siguiente === '\n') i++;
          filaActual.push(celdaActual.trim());
          if (filaActual.some(c => c !== "")) {
            filas.push(filaActual);
          }
          filaActual = [];
          celdaActual = "";
        } else {
          celdaActual += char;
        }
      }

      if (celdaActual !== "" || filaActual.length > 0) {
        filaActual.push(celdaActual.trim());
        if (filaActual.some(c => c !== "")) {
          filas.push(filaActual);
        }
      }

      return filas;
    }

    function inicializarFiltros() {
      filtroCategoria.innerHTML = '<option value="todas">Todas las categorías</option>';
      const categorias = [...new Set(PRODUCTOS.map(p => p.categoria).filter(Boolean))];
      categorias.forEach(cat => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = cat;
        filtroCategoria.appendChild(option);
      });
    }

    function renderizarProductos() {
      const texto = quitarTildes(buscador.value);
      const catSeleccionada = filtroCategoria.value;

      contenedor.innerHTML = '';

      const filtrados = PRODUCTOS.filter(p => {
        const nombreSinTilde = quitarTildes(p.nombre);
        const descSinTilde = quitarTildes(p.descripcion);
        const coincideTexto = nombreSinTilde.includes(texto) || descSinTilde.includes(texto);
        const coincideCat = catSeleccionada === 'todas' || p.categoria === catSeleccionada;
        return coincideTexto && coincideCat;
      });

      filtrados.forEach(prod => {
        const precioLimpio = (prod.precio || "").trim();
        const tieneVariasLineas = /\r?\n/.test(precioLimpio);

        const htmlPrecioDetal = tieneVariasLineas
          ? `<div class="precio">Detal:<br>${precioLimpio.replace(/\r?\n/g, "<br>")}</div>`
          : `<div class="precio">Detal: $${precioLimpio}</div>`;

        const textoDetalWa = tieneVariasLineas
          ? precioLimpio.replace(/\r?\n/g, " / ")
          : `$${precioLimpio}`;

        const tieneMayor = prod.precioMayor && prod.precioMayor.trim() !== "";
        const textoMayorTarjeta = tieneMayor
          ? `<div class="precio-mayor">Al mayor: $${prod.precioMayor}</div>`
          : "";
        const textoMayorWa = tieneMayor ? ` | Mayor: $${prod.precioMayor}` : "";

        const mensaje = encodeURIComponent(
          `Hola, me interesa el producto: *${prod.nombre}* (Detal: ${textoDetalWa}${textoMayorWa})`
        );
        const linkWa = `https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}`;

        contenedor.innerHTML += `
          <div class="tarjeta">
            <img src="${prod.imagen}" alt="${prod.nombre}" loading="lazy">
            <div class="info">
              <span class="categoria">${prod.categoria}</span>
              <h2 class="nombre">${prod.nombre}</h2>
              <p class="descripcion">${prod.descripcion}</p>
              ${htmlPrecioDetal}
              ${textoMayorTarjeta}
              <a href="${linkWa}" target="_blank" rel="noopener noreferrer" class="btn-wa">Pedir por WhatsApp</a>
            </div>
          </div>
        `;
      });
    }

    async function cargarProductos() {
      const resp = await fetch(CSV_URL);
      const texto = await resp.text();
      const filas = parsearCSVCompleto(texto).slice(4);

      PRODUCTOS = filas
        .map(cols => {
          const nombre = cols[1] || "";
          if (!nombre) return null;

          return {
            nombre,
            categoria: cols[2] || "",
            precio: cols[3] || "",
            precioMayor: cols[4] || "",
            descripcion: cols[5] || "",
            imagen: cols[7] || ""
          };
        })
        .filter(Boolean);

      inicializarFiltros();
      renderizarProductos();
    }

    function alternarMenuRedes(forzarEstado) {
      const estaAbierto = panelRedes.classList.contains('abierto');
      const abrir = typeof forzarEstado === 'boolean' ? forzarEstado : !estaAbierto;

      panelRedes.classList.toggle('abierto', abrir);
      btnEsferaRedes.setAttribute('aria-expanded', String(abrir));
      iconoEsfera.textContent = abrir ? '×' : '+';
    }

    btnEsferaRedes.addEventListener('click', (e) => {
      e.stopPropagation();
      alternarMenuRedes();
    });

    panelRedes.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    document.addEventListener('click', () => {
      if (panelRedes.classList.contains('abierto')) {
        alternarMenuRedes(false);
      }
    });

    buscador.addEventListener('input', renderizarProductos);
    filtroCategoria.addEventListener('change', renderizarProductos);

    cargarProductos();
  </script>
</body>
</html>
